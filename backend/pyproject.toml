[project]
name = "tracegoblins"
version = "0.1.0"
description = "Self-hosted AWX/Ansible log analyzer + team collaboration platform"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.0",
    # Pinned directly (FastAPI only caps >=0.46.0): 1.3.1 fixes CVE-2026-54283 (form() DoS)
    # and CVE-2026-54282 (request.url.hostname poisoning).
    "starlette==1.3.1",
    "uvicorn[standard]==0.51.0",
    "uvicorn-worker==0.4.0",
    "gunicorn==26.0.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "argon2-cffi==25.1.0",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "pyotp==2.10.0",
    "qrcode==8.2",
    "httpx==0.28.1",
    "cryptography==50.0.0",  # 48.0.1 ships patched OpenSSL wheels (GHSA-537c-gmf6-5ccf)
    "apscheduler==3.11.3",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "asgi-lifespan==2.1.0",
    "pytest-playwright==0.8.0",
    "playwright==1.61.0",
    "respx==0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers -m 'not e2e'"
markers = [
    "e2e: end-to-end Playwright tests against the docker-compose stack (deselect with -m 'not e2e')",
    "db_per_test: throwaway database instead of transaction rollback (cross-connection / advisory-lock tests)",
]
filterwarnings = ["error::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
